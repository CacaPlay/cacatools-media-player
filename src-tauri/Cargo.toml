[package]
name = "cacatools_media_player"
version = "0.1.1"
description = "Standalone local media player for Windows"
authors = ["CacaPlay"]
license = "MIT"
edition = "2021"

[lib]
name = "cacatools_media_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-runtime = "2"
rfd = "0.17"
tauri-plugin-single-instance = "2.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
